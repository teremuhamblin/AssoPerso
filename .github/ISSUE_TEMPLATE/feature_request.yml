name: Feature Request
description: Proposer une amélioration
labels: [enhancement]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Décris la fonctionnalité souhaitée
    validations:
      required: true

  - type: textarea
    id: value
    attributes:
      label: Valeur ajoutée
      placeholder: Pourquoi cette amélioration ?
    validations:
      required: true
